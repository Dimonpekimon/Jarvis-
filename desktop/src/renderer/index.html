<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <!--
      CSP: страница не грузит ничего извне.
      'unsafe-inline' в script-src нужен только для inline-преамбулы
      React Refresh в dev-режиме Vite; connect-src — для HMR и запросов к
      локальному API Python. Удалённого кода здесь нет, а окно изолировано
      (contextIsolation: true, nodeIntegration: false).
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self' blob: data:; connect-src 'self' ws://127.0.0.1:5273 http://127.0.0.1:8765"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Jarvis Overlay</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
